services:
  - type: web
    name: proposaldsk
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proposaldsk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7

databases:
  - name: proposaldsk-db
    plan: basic-256mb
    databaseName: proposaldsk
    user: proposaldsk
